name: release
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "skill/**"
      - "scripts/**"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
permissions:
  contents: write
concurrency:
  group: mensa-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read package version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("skill/mensa-community-engine/assets/manifest.json"))["version"])')
          RELEASE_TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "Release tag must match the package version" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Validate version and build
        run: |
          python3 scripts/build_release.py --tag "$RELEASE_TAG"
          python3 scripts/validate_acceptance.py
          cd dist
          sha256sum -c SHA256SUMS
      - name: Publish or verify stable ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --pattern mensa-community-engine.zip --pattern SHA256SUMS --dir existing-release
            cmp dist/mensa-community-engine.zip existing-release/mensa-community-engine.zip
            cmp dist/SHA256SUMS existing-release/SHA256SUMS
          else
            gh release create "$RELEASE_TAG" dist/mensa-community-engine.zip dist/SHA256SUMS --draft --target "$GITHUB_SHA" --title "Mensa Community Engine $RELEASE_TAG" --notes-file CHANGELOG.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
