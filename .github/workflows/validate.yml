name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build
        run: |
          python3 scripts/build_release.py
          python3 scripts/validate_acceptance.py
          cd dist
          sha256sum -c SHA256SUMS
